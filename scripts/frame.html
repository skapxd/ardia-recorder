<!doctype html>
<meta charset="utf-8">
<!-- Top layer of the video: background, goals sidebar and an Ardia-style browser window.
     The page area stays transparent; FFmpeg places the capture underneath.
     Keep the page area in sync with PAGE_* in render.py: x 740, y 49, radius 10. Its size, and the
     video's, come in the state (page, video); the defaults are 1131 x 982 inside 1920 x 1080.
     State in ?s=<json>: {title, description, tab, lang, url, page, video, goals:[{title, detail, state, dur}]} -->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* Cut everything (shadows included) out of the page area */
  body{-webkit-mask:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill-rule='evenodd' d='M0 0H1920V1080H0Z M750 49H1861a10 10 0 0 1 10 10V1021a10 10 0 0 1-10 10H750a10 10 0 0 1-10-10V59a10 10 0 0 1 10-10Z'/></svg>")}

  /* Background: Ardia's cream paper with a warm sun glow */
  .bg{position:fixed;inset:0;
    background:radial-gradient(520px 520px at 94% 8%,rgba(251,185,39,.55) 0%,rgba(251,185,39,0) 70%),
               radial-gradient(900px 700px at 0% 100%,rgba(190,140,90,.22) 0%,transparent 65%),
               linear-gradient(160deg,#f3eee4 0%,#ebe3d4 100%)}

  /* Goals sidebar: ink card */
  .side{position:fixed;left:40px;top:40px;width:460px;height:1000px;padding:40px 34px 30px;display:flex;flex-direction:column;
    border-radius:20px;background:#17130f;box-shadow:0 1px 2px rgba(22,19,15,.18),0 26px 60px -10px rgba(22,19,15,.45),inset 0 0 0 1px rgba(255,255,255,.06);color:#f1ece2}
  .eyebrow{font:600 13px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#fbb927}
  h1{font-size:31px;line-height:1.15;font-weight:700;margin-top:14px;letter-spacing:-.01em}
  .desc{font-size:16px;line-height:1.45;color:rgba(241,236,226,.62);margin-top:10px}
  .prog{margin-top:30px}
  .prog .row{display:flex;justify-content:space-between;font-size:14px;color:rgba(241,236,226,.62)}
  .prog .row b{color:#fff;font-weight:600}
  .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#fbb927,#e9785a)}
  .list{list-style:none;padding:0;margin-top:30px;display:flex;flex-direction:column;gap:6px;position:relative}
  .item{position:relative;display:flex;gap:16px;padding:14px 14px;border-radius:12px;border:1px solid transparent}
  .item:not(:last-child)::after{content:"";position:absolute;left:28px;top:46px;bottom:-12px;width:2px;background:rgba(255,255,255,.09)}
  .item.done:not(:last-child)::after{background:rgba(74,196,120,.45)}
  .ico{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(241,236,226,.22);z-index:1;background:#17130f}
  .ico svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .n{font:600 13px/1 system-ui;color:rgba(241,236,226,.45)}
  .txt{flex:1;padding-top:4px}
  .tt{font-size:19px;font-weight:500;color:rgba(241,236,226,.5)}
  .dt{font-size:15px;line-height:1.4;color:rgba(241,236,226,.65);margin-top:6px;display:none}
  .dur{font:500 13px/1 "SF Mono",ui-monospace,monospace;color:#7fd8a0;padding-top:9px;display:none}
  /* Active goal: like Ardia's selected tab, dark with a soft top light */
  .item.active{background:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.02)),rgba(0,0,0,.35);
    box-shadow:0 .5px 24px rgba(251,185,39,.16),inset 0 0 0 1px rgba(251,185,39,.35)}
  .item.active .ico{border-color:#fbb927;box-shadow:0 0 0 5px rgba(251,185,39,.16)}
  .item.active .ico::before{content:"";width:10px;height:10px;border-radius:50%;background:#fbb927}
  .item.active .n{display:none}
  .item.active .tt{color:#fff;font-weight:650}
  .item.active .dt{display:block}
  .item.done .ico{background:#3fb36b;border-color:#3fb36b}
  .item.done .tt{color:rgba(241,236,226,.88)}
  .item.done .dur{display:block}
  .item.failed{background:rgba(232,84,84,.12);box-shadow:inset 0 0 0 1px rgba(232,84,84,.5)}
  .item.failed .ico{background:#e85454;border-color:#e85454}
  .item.failed .tt{color:#fff;font-weight:650}
  .item.failed .dt{display:block;color:#f5b4b4}
  .foot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:12px;font-size:16px;font-weight:600;
    background:rgba(251,185,39,.10);color:#fcd77f}
  .foot i{width:10px;height:10px;border-radius:50%;background:#fbb927;box-shadow:0 0 10px #fbb927}
  .foot.ok{background:rgba(63,179,107,.14);color:#a9ecc2}.foot.ok i{background:#3fb36b;box-shadow:0 0 10px #3fb36b}
  .foot.ko{background:rgba(232,84,84,.14);color:#f5b4b4}.foot.ko i{background:#e85454;box-shadow:0 0 10px #e85454}
  .foot small{margin-left:auto;font:500 13px/1 system-ui;color:rgba(241,236,226,.45)}

  /* Ardia window: warm gradient, vertical tabs on the left, the page on an inset panel */
  .win{position:fixed;left:540px;top:40px;width:1340px;height:1000px;border-radius:14px;
    background:linear-gradient(#443136,#4b4245);
    box-shadow:0 0 0 .5px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.25),0 1px 2px rgba(22,19,15,.14),0 30px 60px rgba(22,19,15,.28)}
  .rail{position:absolute;left:0;top:0;width:200px;height:100%;padding:0 9px;color:#fff;font-size:13px}
  .top{display:flex;align-items:center;height:40px;padding-left:7px;gap:8px}
  .lights{display:flex;gap:8px}
  .lights i{width:12px;height:12px;border-radius:50%;display:block}
  .icons{display:flex;gap:12px;margin-left:auto;padding-right:4px}
  .icons svg{width:15px;height:15px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .addr{height:34px;margin-top:6px;padding:0 10px;display:flex;align-items:center;border-radius:10px;background:rgba(255,255,255,.06);
    font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .newtab{display:flex;align-items:center;gap:9px;height:34px;margin-top:14px;padding:0 9px;color:rgba(255,255,255,.55)}
  .newtab b{font-weight:400;font-size:17px;width:16px;text-align:center}
  .sep{height:1px;margin:2px 6px 4px;background:rgba(255,255,255,.08)}
  /* Fixed position: render.py moves the pointer to these rows (keep TABS_* in sync) */
  .tabs{position:absolute;left:9px;right:9px;top:136px;display:flex;flex-direction:column;gap:3px}
  .tab{display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border-radius:10px;color:rgba(255,255,255,.78)}
  .tab.flash{box-shadow:0 0 0 2px #fbb927,0 0 26px rgba(251,185,39,.55)!important}
  .tab.on{color:#fff;background:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,0) 60%),rgba(18,18,18,.5);box-shadow:0 .5px 30px rgba(255,255,255,.15)}
  .fav{flex:none;width:16px;height:16px;border-radius:4px;background:#e9785a;color:#fff;font:700 10px/16px system-ui;text-align:center}
  .tab span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:5px}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25)}
  .dots i:first-child{background:rgba(255,255,255,.7)}
  .panel{position:absolute;left:200px;top:9px;width:1131px;height:982px;border-radius:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
</style>
<div class="bg"></div>
<aside class="side">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="desc" id="desc"></p>
  <div class="prog"><div class="row"><span id="count"></span><span id="pct"></span></div><div class="bar"><i id="fill"></i></div></div>
  <ol class="list" id="list"></ol>
  <div class="foot" id="foot"><i></i><span id="status"></span><small id="dom"></small></div>
</aside>
<div class="win">
  <div class="rail">
    <div class="top">
      <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="icons">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M9 5v14"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        <svg viewBox="0 0 24 24" style="opacity:.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
    <div class="addr" id="host"></div>
    <div class="newtab"><b>+</b>New Tab</div>
    <div class="sep"></div>
    <div class="tabs" id="tabs"></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div class="panel"></div>
</div>
<script>
  const TEXT = {
    en: {eyebrow: 'Goals', count: (d, n) => `<b>${d}</b> of ${n} goals`, failed: 'A goal failed',
         done: 'All goals completed', running: 'In progress', preparing: 'Preparing', newTab: 'New Tab'},
    es: {eyebrow: 'Objetivos', count: (d, n) => `<b>${d}</b> de ${n} objetivos`, failed: 'Un objetivo falló',
         done: 'Todos los objetivos cumplidos', running: 'En curso', preparing: 'Preparando', newTab: 'Nueva pestaña'},
  };
  const s = JSON.parse(new URLSearchParams(location.search).get('s'));
  // The window grows with the captured page; the sidebar keeps its width and follows the height.
  const [PW, PH] = s.page || [1131, 982], [VW, VH] = s.video || [1920, 1080];
  for (const el of [document.documentElement, document.body]) { el.style.width = VW + 'px'; el.style.height = VH + 'px'; }
  document.querySelector('.side').style.height = VH - 80 + 'px';
  Object.assign(document.querySelector('.win').style, {width: 200 + PW + 9 + 'px', height: PH + 18 + 'px'});
  Object.assign(document.querySelector('.panel').style, {width: PW + 'px', height: PH + 'px'});
  const X0 = 740, Y0 = 49, X1 = X0 + PW, Y1 = Y0 + PH;
  const hole = `M${X0 + 10} ${Y0}H${X1 - 10}a10 10 0 0 1 10 10V${Y1 - 10}a10 10 0 0 1-10 10H${X0 + 10}a10 10 0 0 1-10-10V${Y0 + 10}a10 10 0 0 1 10-10Z`;
  document.body.style.webkitMask = `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='${VW}' height='${VH}'><path fill-rule='evenodd' d='M0 0H${VW}V${VH}H0Z ${hole}'/></svg>`)}")`;
  const T = TEXT[s.lang] || TEXT.en;
  const $ = id => document.getElementById(id), u = new URL(s.url);
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', CROSS = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  document.documentElement.lang = s.lang || 'en';
  // Ardia shows the host in the sidebar's address field, as on ardia.dev
  $('host').textContent = u.host; $('dom').textContent = u.host;
  document.querySelector('.newtab').lastChild.textContent = T.newTab;
  // Vertical tabs: every tab opened so far, the active one highlighted
  const tabs = s.tabs || [s.tab || u.host], active = s.active || 0;
  tabs.forEach((title, i) => {
    const t = document.createElement('div'); t.className = 'tab' + (i === active ? ' on' : '') + (i === s.flash ? ' flash' : '');
    t.innerHTML = '<span class="fav"></span><span></span>';
    t.lastChild.textContent = title || u.host; t.firstChild.textContent = (title || u.host).trim()[0].toUpperCase();
    $('tabs').append(t);
  });
  $('eyebrow').textContent = T.eyebrow; $('title').textContent = s.title; $('desc').textContent = s.description;
  const done = s.goals.filter(g => g.state === 'done').length, total = s.goals.length;
  $('count').innerHTML = T.count(done, total);
  $('pct').textContent = Math.round(100 * done / total) + ' %'; $('fill').style.width = 100 * done / total + '%';
  s.goals.forEach((g, i) => {
    const li = document.createElement('li'); li.className = 'item ' + g.state;
    li.innerHTML = `<div class="ico">${g.state === 'done' ? CHECK : g.state === 'failed' ? CROSS : g.state === 'active' ? '' : `<span class="n">${i + 1}</span>`}</div>
      <div class="txt"><div class="tt"></div><div class="dt"></div></div><div class="dur"></div>`;
    li.querySelector('.tt').textContent = g.title; li.querySelector('.dt').textContent = g.detail;
    li.querySelector('.dur').textContent = g.dur || ''; $('list').append(li);
  });
  const foot = $('foot');
  if (s.goals.some(g => g.state === 'failed')) { foot.classList.add('ko'); $('status').textContent = T.failed; }
  else if (done === total) { foot.classList.add('ok'); $('status').textContent = T.done; }
  else $('status').textContent = done || s.goals.some(g => g.state === 'active') ? T.running : T.preparing;
</script>
